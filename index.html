<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>КОСМОС · 65 лет спустя</title>
  <meta name="description" content="КОСМОС К3. 65 лет первому полёту человека в космос. 12 апреля 1961 / 12 апреля 2026.">
  <meta name="theme-color" content="#030406">
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/K3_Б-high_res.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <!-- Loader -->
  <div class="loader" aria-hidden="true">
    <img class="loader__logo" src="assets/Космос Лого Белый Рус.png" alt="">
    <div class="loader__bar"><span></span></div>
    <span class="loader__pct mono">000</span>
  </div>

  <!-- Brand -->
  <header class="brand">
    <img src="assets/Космос Лого Белый Рус.png" alt="КОСМОС. Сделано в России">
  </header>

  <main>
    <!-- One continuous pinned scene: 65 → Earth → orbit → 108 → light line → watch → macro -->
    <section class="journey" aria-label="65 лет первому полёту человека в космос">
      <div class="stage">

        <canvas class="stars" aria-hidden="true"></canvas>

        <div class="earth" aria-hidden="true">
          <video class="earth__video" src="assets/Earth Rotation Loop [FREE TO USE]_1440p60.mp4"
                 muted loop playsinline autoplay preload="auto"></video>
        </div>

        <div class="limb" aria-hidden="true">
          <img src="assets/space_earth_1.jpg" alt="">
        </div>

        <canvas class="orbit" aria-hidden="true"></canvas>

        <!-- Scene 1 -->
        <div class="title title--65">
          <h1 class="big" aria-label="65 лет спустя">
            <span class="mask"><span class="digit">6</span></span><span class="mask"><span class="digit">5</span></span>
          </h1>
          <div class="title__info">
            <p class="title__sub">ЛЕТ СПУСТЯ</p>
            <p class="title__dates"><span>12 АПРЕЛЯ 1961</span><i></i><span>12 АПРЕЛЯ 2026</span></p>
          </div>
        </div>

        <!-- Scene 3 -->
        <div class="title title--108" aria-label="108 минут орбитального полёта">
          <div class="big">
            <span class="mask"><span class="digit">1</span></span><span class="mask"><span class="digit">0</span></span><span class="mask"><span class="digit">8</span></span>
          </div>
          <div class="title__meta">
            <span class="title__sub">МИНУТ</span>
            <span class="title__tech mono">Orbital flight</span>
          </div>
        </div>

        <!-- Scenes 4–5: the watch materialises from the light ring -->
        <div class="watch" aria-hidden="true">
          <img class="w w--rim"   src="assets/K3_Б-high_res.png" alt="">
          <img class="w w--body"  src="assets/K3_Б-high_res.png" alt="">
          <img class="w w--dial"  src="assets/K3_Б-high_res.png" alt="">
          <img class="w w--lit"   src="assets/K3_Б-high_res.png" alt="">
          <img class="w w--sweep" src="assets/K3_Б-high_res.png" alt="">
        </div>

        <!-- Scene 6: filmed close-up, scrubbed frame by frame -->
        <canvas class="film" aria-hidden="true"></canvas>
        <div class="film-vignette" aria-hidden="true"></div>

      </div>
    </section>
  </main>

  <!-- HUD -->
  <div class="hud" aria-hidden="true">
    <div class="hud__coord mono"><span class="hud__coord-a">45°55′N 63°20′E</span><span class="hud__coord-b">Baikonur · 06:07 UTC</span></div>
    <div class="hud__clock mono"><span class="hud__clock-label">T+</span><span class="hud__clock-value">00:00:00</span></div>
    <div class="hud__rail"><span></span></div>
    <div class="hud__cue mono">Scroll<i></i></div>
  </div>

  <div class="grain" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/orbit.js"></script>
  <script src="js/sequence.js"></script>
  <script src="js/scene.js"></script>
</body>
</html>
